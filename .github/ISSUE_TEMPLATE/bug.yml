name: Bug
description: Report something that does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Which part of the app (dashboard, API, Publisher, Subscriber) and which environment (local, k3d, production).
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant log lines. Remove any secrets first.
      render: text
