apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
---
# Traefik (built into k3s and k3d) routes these paths to the API.
# The React app is not in the cluster: production serves it from S3 through CloudFront.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/hossem7/statustide-api
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: statustide-secrets
                  key: POSTGRES_PASSWORD
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: statustide-secrets
                  key: RABBITMQ_PASSWORD
            - name: Jwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: statustide-secrets
                  key: JWT_SIGNING_KEY
            - name: ConnectionStrings__Postgres
              value: Host=postgres;Port=5432;Database=statustide;Username=statustide;Password=$(POSTGRES_PASSWORD)
            - name: ConnectionStrings__Redis
              value: redis:6379
            - name: ConnectionStrings__RabbitMq
              value: amqp://statustide:$(RABBITMQ_PASSWORD)@rabbitmq:5672/
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
