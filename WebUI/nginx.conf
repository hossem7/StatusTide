# This image only runs in Docker Compose. Production serves the build from S3 through CloudFront.

# SignalR upgrades to WebSockets, other requests keep a plain connection.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Leaves out the query string, since browsers send the access token there for the SignalR hub.
log_format no_query '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 8080;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log no_query;

    location ~ ^/(api|hubs)/ {
        # Docker's DNS, looked up per request through the variable. A fixed upstream would keep
        # the old address and return 502 after the API container is recreated.
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8080;
        proxy_pass $api;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        # Single-page app: unknown paths fall back to index.html.
        try_files $uri $uri/ /index.html;
    }
}
